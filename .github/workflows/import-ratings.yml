name: Import Open Library ratings

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  import-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import Open Library ratings
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/import-open-library-ratings.mts --max=150
