name: Merge duplicate catalog books

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch: {}

jobs:
  merge-duplicate-books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Review pending books and merge cross-language duplicates
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/merge-duplicate-books.mts --max=100
