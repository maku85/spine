name: Import Hardcover series and mood tags

on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch: {}

jobs:
  import-hardcover-book-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import series and mood tags from Hardcover
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
        run: node scripts/import-hardcover-book-data.mts
