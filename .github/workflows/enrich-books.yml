name: Enrich catalog books

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  enrich-books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enrich books with Open Library data
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/enrich-books.mts --max=150
